name: hikari

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:?điền DB_NAME trong file .env}
      MYSQL_USER: ${DB_USER:?điền DB_USER trong file .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?điền DB_PASSWORD trong file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?điền DB_ROOT_PASSWORD trong file .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      TIME_ZONE: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
      SECRET_KEY: ${SECRET_KEY:?điền SECRET_KEY trong file .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      HTTPS_ONLY: ${HTTPS_ONLY:-False}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MEDIA_ROOT: /app/media
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    volumes:
      - media:/app/media

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media:
  caddy_data:
  caddy_config: